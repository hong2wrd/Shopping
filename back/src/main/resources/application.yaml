spring:
  application:
    name: shopping
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jwt:
    prefix: "Bearer "
    access-expiration-time: 1_800_000 # 30분
    refresh-expiration-time: 604_800_000 # 7일
    secret: ${JWT_SECRET}
    accessTokenHeader: Authorization
    refreshTokenHeader: Refresh-Token

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}

cookie:
  secure: true;
